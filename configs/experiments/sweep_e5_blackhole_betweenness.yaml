# configs/experiments/sweep_e5_blackhole_betweenness.yaml
# E5-c 放置敏感性模板 —— 黑洞攻击臂，placement=betweenness（介数中心性 top-K）。
# 与 sweep_demo_e3_blackhole_degree.yaml 仅 placement 不同（同 runner/匹配键/常驻窗口），
# 供 sweep_e5_placement.yaml 与 degree/random 臂在同一基线上横向对比。
# 注意：E5 执行任务应把 node_limit 放大（>=1024 或全量）以得到有意义的放置差异。

experiment:
  name: "sweep_e5_blackhole_betweenness"
  duration: 60
  seed: null

topology:
  shell: "53°"
  epoch_interval: 30
  node_limit: 96
  subset_method: "cumulative_degree"
  cache_path: "data/topology/topology_results.pkl"
  positions_cache: null

routing:
  t_adv: 2.0
  tick: 0.2
  max_hops: 100

traffic:
  num_flows: 20

attack:
  attackers:
    - type: "blackhole"
      count: 3
      placement: "betweenness"
      active_since: 0.0
      active_until: .inf
      params:
        drop_prob: 0.8
        metric_fake: 0

output:
  raw_dir: "results/sweep_e5_raw/"
  agg_dir: "results/sweep_e5_agg/"
  figures_dir: "results/figures/"
