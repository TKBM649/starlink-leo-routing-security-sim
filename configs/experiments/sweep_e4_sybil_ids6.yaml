# configs/experiments/sweep_e4_sybil_ids6.yaml
# E4 Sybil 攻击臂 —— **身份数 vs 效果**梯度的中档：1 个被劫持物理节点呈现 6 个虚假身份。
# 与 sweep_e4_sybil_ids2.yaml 仅 params.num_identities 不同（同 runner/匹配键/附着策略），
# 供 sweep_e4_sybil.yaml 在同一基线上做身份数梯度对比。
# 预期：身份数越多 → 附着的真实节点越多 → sybil_attraction_ratio 越高、delivery_ratio 越低。

experiment:
  name: "sweep_e4_sybil_ids6"
  duration: 60
  seed: null

topology:
  shell: "53°"
  epoch_interval: 30
  node_limit: 96
  subset_method: "cumulative_degree"
  cache_path: "data/topology/topology_results.pkl"
  positions_cache: null

routing:
  t_adv: 2.0
  tick: 0.2
  max_hops: 100

traffic:
  num_flows: 20

attack:
  attackers:
    - type: "sybil"
      count: 1
      placement: "degree"
      active_since: 0.0
      active_until: .inf
      params:
        num_identities: 6
        attachment: "betweenness"
        metric_fake: 0
        seq_lead: 8
        drop_prob: 0.0
        controller_poisons: false

output:
  raw_dir: "results/sweep_e4_raw/"
  agg_dir: "results/sweep_e4_agg/"
  figures_dir: "results/figures/"
