# configs/experiments/sweep_e5_blackhole_random.yaml
# E5-c 放置敏感性模板 —— 黑洞攻击臂，placement=random（拓扑内均匀随机，rng 由 seed 决定）。
# 与 degree/betweenness 臂仅 placement 不同（同 runner/匹配键/常驻窗口）。
# random 作为放置敏感性的下界对照：随机选点通常比 degree/betweenness 命中关键节点少。

experiment:
  name: "sweep_e5_blackhole_random"
  duration: 60
  seed: null

topology:
  shell: "53°"
  epoch_interval: 30
  node_limit: 96
  subset_method: "cumulative_degree"
  cache_path: "data/topology/topology_results.pkl"
  positions_cache: null

routing:
  t_adv: 2.0
  tick: 0.2
  max_hops: 100

traffic:
  num_flows: 20

attack:
  attackers:
    - type: "blackhole"
      count: 3
      placement: "random"
      active_since: 0.0
      active_until: .inf
      params:
        drop_prob: 0.8
        metric_fake: 0

output:
  raw_dir: "results/sweep_e5_raw/"
  agg_dir: "results/sweep_e5_agg/"
  figures_dir: "results/figures/"
