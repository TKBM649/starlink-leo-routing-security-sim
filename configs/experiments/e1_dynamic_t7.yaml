# configs/experiments/e1_dynamic_t7.yaml
# T7 门槛验证用 E1 动态拓扑基线（降规模但具代表性）——无攻击。
# runner：scripts/run_simulation.py（Simulator 动态逐 epoch 评估 + 逐 epoch 路由表快照）。
# node_limit=512（BFS 子集，节点 ID 稀疏 → 路由域仍为 4284 个路由器，与 E2/E3 T7 配置同规模族）；
# duration=600 → 20 个评估 epoch（覆盖拓扑动态与 DV 老化收敛）；trials = 100 × 20 × 1 = 2000 / seed。
# 匹配键（53°/512/20/100）与 E2/E3 T7 臂不同（num_eval_epochs 不同）→ 基数守卫应拒绝跨臂误比。
# 运行：python scripts/run_simulation.py --config configs/experiments/e1_dynamic_t7.yaml --seeds 42 43 44 45 46 --no-aggregate

experiment:
  name: "e1_dynamic_t7"
  duration: 600
  seed: null

topology:
  shell: "53°"
  epoch_interval: 30
  node_limit: 512
  cache_path: "data/topology/topology_results.pkl"
  positions_cache: null

routing:
  t_adv: 2.0
  tick: 0.2
  max_hops: 100

traffic:
  num_flows: 100

attack:
  attackers: []

output:
  raw_dir: "results/raw_t7/"
  agg_dir: "results/aggregated_t7/"
  figures_dir: "results/figures/"
