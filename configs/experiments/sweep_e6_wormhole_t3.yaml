# configs/experiments/sweep_e6_wormhole_t3.yaml
# E6 Wormhole 攻击臂 —— **隧道数 vs 效果**梯度的高档：3 条独立隧道。
# 与 sweep_e6_wormhole_t1.yaml 仅 count 不同（同 runner/匹配键/端点策略/poison_scope），
# 供 sweep_e6_wormhole.yaml 在同一基线上做隧道数梯度对比。
#
# count=3 → placement(degree) 选 3 个 A 端（累计度 top-3 枢纽），再由 endpoint_strategy
# (farthest) 为每个 A 选 1 个互不复用的 B 端（expand_topology_for_wormholes 保证 4 个端点
# 两两相异），共注入 3 条隧道边。节点 ID 空间仍为 96（虫洞不新增身份），故与基线严格可比。
#
# 预期：隧道越多 → 被牵引的 flow-epoch 占比越高（wormhole_attracted_ratio 上升）、
#   物理接地检测器检出的隧道数越多（wormhole_detected_tunnels≈3、detection_rate≈1）。

experiment:
  name: "sweep_e6_wormhole_t3"
  duration: 60
  seed: null

topology:
  shell: "53°"
  epoch_interval: 30
  node_limit: 96
  subset_method: "cumulative_degree"
  cache_path: "data/topology/topology_results.pkl"
  positions_cache: null

routing:
  t_adv: 2.0
  tick: 0.2
  max_hops: 100

traffic:
  num_flows: 20

# 与基线臂逐字一致的检测参数（确保误报率/检测率同口径可比）。
detection:
  wormhole:
    enabled: true
    max_isl_km: 2000.0
    distance_factor: 1.5
    adaptive_factor: 3.0
    latency_factor: 1.0

attack:
  attackers:
    - type: "wormhole"
      count: 3
      placement: "degree"
      active_since: 0.0
      active_until: .inf
      params:
        endpoint_strategy: "farthest"
        poison_scope: "peer_only"
        metric_fake: 0
        seq_lead: 8
        drop_prob: 0.0
        pool_size: 48

output:
  raw_dir: "results/sweep_e6_raw/"
  agg_dir: "results/sweep_e6_agg/"
  figures_dir: "results/figures/"
