# configs/experiments/step3/a_base_53_1024_whdet.yaml
# 无攻击基线臂（shell=53°, node_limit=1024, 虫洞检测开启以度量误报率）。
#
# 本文件由 scripts/gen_step3_configs.py 生成 —— **请勿手工编辑**；
# 需改口径时改生成器后重跑该脚本（幂等覆盖）。
# 匹配键四元组 (shell, node_limit, num_eval_epochs, num_flows) = (53°, 1024, 2, 20)；total_trials = 40/seed。

experiment:
  name: "s3_base_53_1024_whdet"
  duration: 60
  seed: null

topology:
  shell: "53°"
  epoch_interval: 30
  node_limit: 1024
  subset_method: "cumulative_degree"
  cache_path: "data/topology/topology_results.pkl"
  positions_cache: null

routing:
  t_adv: 2.0
  tick: 0.2
  max_hops: 100

traffic:
  num_flows: 20

# 与攻击臂逐字一致的检测参数（基线臂靠它度量**误报率**）。
detection:
  wormhole:
    enabled: true
    max_isl_km: 2000.0
    distance_factor: 1.5
    adaptive_factor: 3.0
    latency_factor: 1.0

attack:
  attackers: []

output:
  raw_dir: "results/step3_raw/"
  agg_dir: "results/step3_agg/"
  figures_dir: "results/figures/"
