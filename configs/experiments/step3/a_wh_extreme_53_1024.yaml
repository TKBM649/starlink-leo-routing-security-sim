# configs/experiments/step3/a_wh_extreme_53_1024.yaml
# E6 Wormhole 攻击臂：3 条隧道，毒化经对端的**全部**路由（破坏性）。endpoint_strategy=farthest、seq_lead=8、drop_prob=0（虫洞不丢包，效果体现为路径牵引）。
#
# 本文件由 scripts/gen_step3_configs.py 生成 —— **请勿手工编辑**；
# 需改口径时改生成器后重跑该脚本（幂等覆盖）。
# 匹配键四元组 (shell, node_limit, num_eval_epochs, num_flows) = (53°, 1024, 2, 20)；total_trials = 40/seed。

experiment:
  name: "s3_wh_extreme_53_1024"
  duration: 60
  seed: null

topology:
  shell: "53°"
  epoch_interval: 30
  node_limit: 1024
  subset_method: "cumulative_degree"
  cache_path: "data/topology/topology_results.pkl"
  positions_cache: null

routing:
  t_adv: 2.0
  tick: 0.2
  max_hops: 100

traffic:
  num_flows: 20

# 与攻击臂逐字一致的检测参数（基线臂靠它度量**误报率**）。
detection:
  wormhole:
    enabled: true
    max_isl_km: 2000.0
    distance_factor: 1.5
    adaptive_factor: 3.0
    latency_factor: 1.0

attack:
  attackers:
    - type: "wormhole"
      count: 3
      placement: "degree"
      active_since: 0.0
      active_until: .inf
      params:
        drop_prob: 0.0
        endpoint_strategy: "farthest"
        metric_fake: 0
        poison_scope: "peer_side"
        pool_size: 48
        seq_lead: 8

output:
  raw_dir: "results/step3_raw/"
  agg_dir: "results/step3_agg/"
  figures_dir: "results/figures/"
